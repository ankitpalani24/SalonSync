name: SalonSync CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────────────────────────
  # STAGE 1: LINTING & SYNTAX VALIDATION
  # ─────────────────────────────────────────────────────────────
  lint-and-typecheck:
    name: 🔍 Lint & Syntax Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20 Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Backend Linter (Oxlint)
        run: |
          cd backend
          npx oxlint .

      - name: Run Frontend Linter (Oxlint)
        run: |
          cd frontend
          npx oxlint .

  # ─────────────────────────────────────────────────────────────
  # STAGE 2: AUTOMATED TEST SUITE (Backend & Frontend)
  # ─────────────────────────────────────────────────────────────
  test:
    name: 🧪 Automated Test Suite
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck]

    env:
      JWT_SECRET: "ci_cd_github_actions_test_secret_key_999"
      NODE_ENV: "test"

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20 Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: |
          cd backend && npm ci
          cd ../frontend && npm ci

      - name: Run Backend Unit & Integration Tests (Jest)
        run: |
          cd backend
          npm test

      - name: Run Frontend Component Tests (Vitest)
        run: |
          cd frontend
          npm test

  # ─────────────────────────────────────────────────────────────
  # STAGE 3: PRODUCTION BUILD VERIFICATION
  # ─────────────────────────────────────────────────────────────
  build:
    name: 🏗️ Production Build Verification
    runs-on: ubuntu-latest
    needs: [test]

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20 Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Frontend Assets
        run: |
          cd frontend
          npm run build

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  # STAGE 4: DEPLOYMENT CHECKS & ENVIRONMENT GATES
  # ─────────────────────────────────────────────────────────────
  deployment-checks:
    name: 🚀 Deployment Health Checks & Gates
    runs-on: ubuntu-latest
    needs: [build]
    
    # Environment gate selection: PRs = Development, develop = Staging, main = Production
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'Production' || (github.ref == 'refs/heads/develop' && 'Staging' || 'Development') }}

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Verify Live Backend API Health Endpoint
        run: |
          echo "Checking Backend API Health..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://salonsync-api.onrender.com/ || true)
          echo "Backend API response HTTP status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -eq 200 ] || [ "$HTTP_STATUS" -eq 503 ]; then
            echo "API server responded cleanly ($HTTP_STATUS)."
          else
            echo "Warning: API endpoint returned HTTP status $HTTP_STATUS"
          fi

      - name: Trigger Render Backend Deployment Hook (If Configured)
        if: github.ref == 'refs/heads/main' && secrets.RENDER_DEPLOY_HOOK_URL != ''
        run: |
          echo "Triggering Render Production Deployment..."
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
          echo "Render deployment hook triggered successfully."

      - name: Trigger Vercel Frontend Deployment Hook (If Configured)
        if: github.ref == 'refs/heads/main' && secrets.VERCEL_DEPLOY_HOOK_URL != ''
        run: |
          echo "Triggering Vercel Production Deployment..."
          curl -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}"
          echo "Vercel deployment hook triggered successfully."

      - name: Log Deployment Pipeline Summary
        run: |
          echo "==================================================="
          echo "  SALONSYNC CI/CD PIPELINE COMPLETE"
          echo "  Branch: ${{ github.ref }}"
          echo "  Commit: ${{ github.sha }}"
          echo "  Status Checks: PASSED (Lint, Tests, Build)"
          echo "==================================================="
